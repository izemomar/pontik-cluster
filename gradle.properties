# The JDK comes from your environment, and Gradle will never download one for you. If
# the toolchain is missing, the build fails and tells you so, instead of quietly
# fetching a compiler over the network.
org.gradle.java.installations.auto-download=false

# Gradle reuses the configuration of your last build when nothing it read has
# changed, so a repeated ./gradlew check starts sooner.
org.gradle.configuration-cache=true
